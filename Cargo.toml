[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
shade-core = { path = "crates/core" }
shade-proto = { path = "crates/proto" }
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
infinity-agent-core = "=0.2.0"
infinity-provider-protocol = "=0.2.0"
http = "1.5.0"
infinity-provider-rig = "=0.2.0"
rig-core = "=0.31.0"
rap-protocol = "=0.2.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
thiserror = "2.0.21"
toml = "0.9"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
disallowed_methods = "deny"
