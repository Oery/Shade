# Copy to ~/.config/shade/config.toml (or pass `shaded --config PATH`).

# IANA time zone used by the `now` tool. UTC when absent.
timezone = "Europe/Paris"

[model]
provider = "anthropic"
id = "claude-opus-5-5"
# Variable holding the API key: read from the environment, or from a `.env`
# file next to this config (must be `chmod 600`). The key never goes in this file.
api_key_env = "ANTHROPIC_API_KEY"
context_window = 1000000
max_output_tokens = 128000
# Every message resends the whole conversation, so its size is what a turn
# costs. Past this many tokens the conversation is summarized. Defaults to
# 100k, or 75% of context_window if that is smaller.
# compact_at_tokens = 100000

# OpenCode Go subscription instead (https://opencode.ai/docs/en/go/).
# Use the API format the model page lists: `openai_compatible` with
# base_url ".../go/openai/v1", or `anthropic` with base_url ".../go/anthropic".
# Limits per model: https://models.dev/api.json under "opencode-go".
#
# [model]
# provider = "openai_compatible"
# base_url = "https://opencode.ai/inference/go/openai/v1"
# # OpenCode routes by conversation and rejects requests without this header.
# session_header = "x-opencode-session"
# id = "kimi-k3"
# api_key_env = "OPENCODE_API_KEY"
# context_window = 1048576
# max_output_tokens = 131072

# Owner chat (terminal and Discord). Without this section chat has no tools.
# Known caps: now, notify, shell, shell_network, schedules, watches.
[chat]
caps = ["now"]
# prompt = "You are chatting with your owner."

# Where `shell` runs. Required when any origin holds `shell`; the daemon
# checks it at startup by running a command in it, and refuses to start if
# that fails. Commands see the system read-only, the workspace at /workspace,
# a private /tmp, and nothing else from your home or Shade's directories.
# Neither path may overlap Shade's config, data, or executable directories,
# or contain your home directory.
# [sandbox]
# workspace = "/home/me/shade-workspace"
# Mounted at /vault only for conversations that hold the `vault` capability.
# vault = "/home/me/notes"
# Variables copied from the daemon's environment; everything else is cleared.
# env = ["LANG"]
# Commands run for 30 seconds unless they ask for more, up to this limit.
# max_timeout_seconds = 300
# Development only: run commands on the host with your full authority.
# isolation = "off"

# Owner chat over Discord: DMs, and messages that mention the bot in server
# channels. Each channel is its own conversation; `/new` starts a fresh one.
# Replies in a server channel are visible to everyone in it, so keep private
# work in DMs. Enable the Message Content intent for the bot in the Developer
# Portal: Discord hides the text of messages that mention the bot's role.
# [discord]
# Variable holding the bot token, read like model.api_key_env.
# token_env = "DISCORD_BOT_TOKEN"
# Discord user IDs allowed to chat (Developer Mode, then "Copy User ID").
# owners = [123456789012345678]

# Webhook sources. Hooks can never hold `schedules` or `watches`.
# [hooks.github]
# caps = ["now", "notify"]

# Shared bounds on one chat turn or background run, children included.
# These are the defaults.
[limits]
max_completion_rounds = 40
max_tool_calls = 100
max_run_seconds = 900
