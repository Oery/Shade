# Copy to ~/.config/shade/config.toml (or pass `shaded --config PATH`).

# IANA time zone used by the `now` tool. UTC when absent.
timezone = "Europe/Paris"

[model]
provider = "anthropic"
id = "claude-opus-5-5"
# Variable holding the API key: read from the environment, or from a `.env`
# file next to this config (must be `chmod 600`). The key never goes in this file.
api_key_env = "ANTHROPIC_API_KEY"
context_window = 1000000
max_output_tokens = 128000
# Every message resends the whole conversation, so its size is what a turn
# costs. Past this many tokens the conversation is summarized. Defaults to
# 100k, or 75% of context_window if that is smaller.
# compact_at_tokens = 100000

# Optional estimates for `shade usage`: your prices, in USD per million
# tokens (0..1000000). Omit this for subscriptions or unknown prices.
# Input includes cached tokens; Shade subtracts those before charging the
# uncached input rate. All three rates are required. These are examples,
# not prices for the model above. Each request keeps its historical estimate.
# [model.prices]
# input_per_million = 2.0
# cached_input_per_million = 0.5
# output_per_million = 10.0

# OpenCode Go subscription instead (https://opencode.ai/docs/en/go/).
# Use the API format the model page lists: `openai_compatible` with
# base_url ".../go/openai/v1", or `anthropic` with base_url ".../go/anthropic".
# Limits per model: https://models.dev/api.json under "opencode-go".
#
# [model]
# provider = "openai_compatible"
# base_url = "https://opencode.ai/inference/go/openai/v1"
# # OpenCode routes by conversation and rejects requests without this header.
# session_header = "x-opencode-session"
# id = "kimi-k3"
# api_key_env = "OPENCODE_API_KEY"
# context_window = 1048576
# max_output_tokens = 131072

# Owner chat (terminal and Discord). Without this section chat has no tools.
# Known caps: now, notify, shell, shell_network, schedules, watches, and the
# name of each server under [mcp].
[chat]
caps = ["now"]
# prompt = "You are chatting with your owner."

# Where `shell` runs. Required when any origin holds `shell`; the daemon
# checks it at startup by running a command in it, and refuses to start if
# that fails. Commands see the system read-only, the workspace at /workspace,
# a private /tmp, and nothing else from your home or Shade's directories.
# Neither path may overlap Shade's config, data, or executable directories,
# or contain your home directory.
# [sandbox]
# workspace = "/home/me/shade-workspace"
# Mounted at /vault only for conversations that hold the `vault` capability.
# vault = "/home/me/notes"
# Variables copied from the daemon's environment; everything else is cleared.
# env = ["LANG"]
# Commands run for 30 seconds unless they ask for more, up to this limit.
# max_timeout_seconds = 300
# Development only: run commands on the host with your full authority.
# isolation = "off"

# Discord: owners may DM or mention the bot in server channels. Other users
# may mention it in server channels with separate guest permissions.
# Each channel has separate owner and guest conversations. The `/new` slash
# command starts a fresh owner conversation; only owners may use it or approvals.
# Replies in a server channel are visible to everyone in it, so keep private
# work in DMs. Enable the Message Content intent for the bot in the Developer
# Portal: Discord hides the text of messages that mention the bot's role.
# [discord]
# Variable holding the bot token, read like model.api_key_env.
# token_env = "DISCORD_BOT_TOKEN"
# Discord user IDs with [chat] permissions (Developer Mode, then "Copy User ID").
# The first one is `dm` for notifications, and receives failure notices.
# owners = [123456789012345678]
# Everyone else can get answers by mentioning the bot, with no tools by default.
# Guest caps are independent of [chat]; schedules and watches are owner-only.
# `notify`, if granted, can message only the owner. Granting a server also
# shares its tools and any memory tied to it. All guests in a channel share
# one guest conversation, separate from the owners' history and custom prompt.
# [discord.guests]
# caps = ["now"]
# Channels notifications and jobs can name (right-click, "Copy Channel ID").
# Owner chat may also post to any channel by ID or #mention; a scheduled run
# only to its job's channels.
# [discord.channels]
# alerts = 123456789012345678

# Background runs started by scheduled jobs. Each run gets only the caps its
# job was given, never more than [chat] holds, and never schedules/watches.
#
# Long-lived jobs can live in files, one per job, in a `jobs/` directory next
# to this config: jobs/morning-brief.toml becomes job `morning-brief`. They
# are read at startup (a bad file stops the daemon) and win over earlier
# edits; run history and pause state are kept. Owner chat can draft and edit
# them too, but each create, edit or delete of a job file waits for the
# owner: Approve and Reject buttons in Discord, or `shade schedule approve
# <code>` / `reject <code>`. Jobs kept only in the database never ask.
# For example:
#
#   title = "Morning brief"
#   cron = "0 8 * * 1-5"              # or: at = "2026-12-24T18:00:00+01:00"
#   timezone = "Europe/Paris"         # optional; defaults to `timezone` above
#   caps = ["now", "notify"]
#   channels = ["dm", "alerts"]       # where runs may post; the first is the default
#   prompt = """
#   Summarize what the owner should know this morning.
#   """
#
# [jobs]
# Replaces Shade's default instructions, which tell the model that nobody
# reads its replies and to use `notify` when the owner should know.
# prompt = "You are running a background job."

# MCP servers. Each name is a capability: a conversation or job holding it
# gets the server's tools, as `<name>_<tool>`. Servers start with the daemon
# (one that cannot start is retried every minute and never holds up startup)
# and run as your user, outside the sandbox, with a cleared environment:
# PATH, HOME and XDG_* only, plus `vars` as written and the secrets listed
# in `env`, read from the environment or the `.env` next to this config. A
# call that gets no answer in time is reported as possibly done, and never
# sent again.
# [mcp.nightbot]
# command = ["/path/to/mcp-nightbot"]
# env = ["NIGHTBOT_CLIENT_ID", "NIGHTBOT_CLIENT_SECRET"]
# description = "Read and edit the custom chat commands of the Nightbot channel."
# startup_timeout_seconds = 20
# call_timeout_seconds = 60
#
# [mcp.obsidian]
# command = ["/path/to/mcp-obsidian"]
# vars = { OBSIDIAN_VAULT = "/home/me/Notes" }
# description = "Read and edit the notes of the owner's Obsidian vault."

# Durable memory in the vault: an index (one line per memory) and a note per
# memory next to it, kept by the model with the vault server's tools. Only
# conversations and jobs holding that server's capability see the index. It
# is re-read on every model request, at most 4 KiB.
# [memory]
# server = "obsidian"
# vault = "/home/me/Notes"     # the server's vault directory
# index = "Shade/MEMORY.md"    # relative to the vault; this is the default

# Webhooks: `POST /hook/<name>` with `Authorization: Bearer <token>` starts a
# background run with this hook's caps (never `schedules` or `watches`). The
# event is stored before the sender gets `202`; a body that does not match the
# condition gets `202` with nothing run. Bodies up to 64 KiB; anything the
# condition cannot decide is a client error. An unknown hook gets the same
# `401` as a wrong token.
#
# The body is untrusted: it never chooses the run's caps or destination, but
# whatever sends events can steer what the run does with the caps it has.
# Start hooks at `notify`; give one `shell` or a server that writes only if you
# trust everything that can reach it.
# [hooks.backup]
# caps = ["notify"]
# token_env = "SHADE_HOOK_BACKUP"        # at least 32 characters: `openssl rand -hex 32`
# condition = { pointer = "/status", op = "==", value = "failed" }
# delivery_header = "X-Delivery-Id"      # a repeated ID gets the earlier acceptance
# template = "The nightly backup reported:\n<body>\n{body}\n</body>"   # {hook} and {body}
# max_per_minute = 10                    # more get 429
# max_queued = 20                        # more get 429
#
# Where webhooks are served: loopback or this machine's Tailscale address
# only; anything else stops startup. To reach them from your other devices
# over HTTPS, keep the default and run
#   tailscale serve --bg --https=443 http://127.0.0.1:8787
# then POST to https://<machine>.<tailnet>.ts.net/hook/<name>.
# [http]
# listen = "127.0.0.1:8787"

# Shared bounds on one chat turn or background run, children included.
# These are the defaults.
[limits]
max_completion_rounds = 40
max_tool_calls = 100
max_run_seconds = 900
# Messages the model may send with `notify`. A run's failure notice from
# Shade itself does not count against this.
max_notifications = 10
# Scheduled runs at once; the rest wait in the queue, across restarts too.
max_concurrent_background_runs = 4
